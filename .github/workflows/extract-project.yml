name: Extract FacuAlerta project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          zip_file="$(find FacuAlerta1 -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$zip_file" ]; then
            echo "No ZIP file found in FacuAlerta1."
            exit 0
          fi

          echo "Extracting: $zip_file"
          unzip -o "$zip_file" -d "FacuAlerta1"

          # Remove the ZIP after extracting it so the next ZIP can use any name.
          rm -f "$zip_file"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A FacuAlerta1

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract latest FacuAlerta ZIP"
          git push
