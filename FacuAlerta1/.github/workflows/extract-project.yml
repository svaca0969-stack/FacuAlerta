name: Extract FacuAlerta1 project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o "FacuAlerta1/FacuAlerta_Final(1).zip" -d "FacuAlerta1"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FacuAlerta1
          git rm --cached "FacuAlerta1/FacuAlerta_Final(1).zip" || true
          git commit -m "Extract FacuAlerta1 project files" || exit 0
          git push
